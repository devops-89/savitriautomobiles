
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404-Error</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
     
       <!-- CSS Files
    ================================================== -->
    <link
      href="css/bootstrap.min.css"
      rel="stylesheet"
      type="text/css"
      id="bootstrap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    
    <style> 
    body {
       margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #020617, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      color: white;
    }
    .card-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
      
    }

    .error-code {
      font-size: 100px;
      font-weight: bold;
      color: #22c55e;
      text-shadow: 0 0 15px rgba(34,197,94,0.6);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: #f87171;
    }

    .message {
      font-size: 16px;
      color: #cbd5e1;
    }

    .btn-home {
      margin-top: 20px;
      padding: 10px 25px;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      border: none;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-home:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    .social-icons {
  margin-top: 20px;
}

.social-icons a {
  margin: 0 8px;
  font-size: 18px;
  color: #cbd5e1;
  transition: 0.3s;
}

.social-icons a:hover {
  color: #22c55e;
  transform: translateY(-3px);
}

.social-icons a {
  background: rgba(255,255,255,0.05);
  padding: 10px;
  border-radius: 50%;
}
  </style>
</head>
<body>
   <div class="card-box">
    
    <div class="icon">
      <i class="fas fa-exclamation-triangle"></i>
    </div>

    <div class="error-code">404</div>

    <h2>Page Not Found</h2>

    <p class="message">
      Oops! The page you're looking for doesn't exist or has been moved.
    </p>

    <a href="index.html" class="btn-home">
      Go Back Home
    </a>

    <div class="social-icons">
        <a href="https://www.facebook.com/savitri.automobile/"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/savitriautomobiles/"><i class="fa-brands fa-instagram"></i
></a>

    </div>

  </div>
</body>
</html>
